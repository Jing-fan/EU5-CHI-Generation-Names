l_simp_chinese:
 # ==========================================================
 # 决议与事件文本
 # ==========================================================
 establish_dynastic_zibei_decision: "钦定宗室字辈"
 establish_dynastic_zibei_decision.title: "钦定宗室字辈"
 establish_dynastic_zibei_decision_desc: "按字排辈、修谱序宗，乃华夏自古相沿之礼。今天命攸归，宗支日繁，为明昭穆之序、辨长幼之分、固宗藩之本，当将此制立为国朝定制，为我朝万世子孙钦定字辈谱系。"
 establish_dynastic_zibei_decision.desc: "按字排辈、修谱序宗，乃华夏自古相沿之礼。今天命攸归，宗支日繁，为明昭穆之序、辨长幼之分、固宗藩之本，当将此制立为国朝定制，为我朝万世子孙钦定字辈谱系。"
 establish_dynastic_zibei_decision.historical_info: "按字辈排行并修撰宗族谱系的传统在中国古已有之。从先秦宗法中区分长幼次序、魏晋门阀流行的同字连名，到唐宋以来民间修谱之风兴盛，各大家族普遍会用诗句或吉语预先定好后世各代的辈分用字，借此分清辈分尊卑、维系宗族血脉认同。明朝建立后，明太祖朱元璋大封诸子为藩王，他考虑到日后皇室子孙繁衍众多，若无统一规范极易出现重名混乱、辈分不清和血缘疏远的问题，同时也为了方便朝廷核查宗室名册、用宗法伦理加强皇室大宗对各地藩王的凝聚与约束，便将这一民间宗族习俗正式定为国策并写入《皇明祖训》。他亲自为东宫和诸王各拟定了二十个字辈，并规定后世名字的末字按火、土、金、水、木的五行相生顺序世代轮换。此后，清朝等后世王朝也延续了这一做法，由皇帝钦定皇室字辈，并为每一代配以专属偏旁。"
 establish_dynastic_zibei_decision.a: "敕令礼部，议定宗室字辈"
 establish_dynastic_zibei_decision.a.tt: "将开启宗室字辈择定流程，依次选定命名规制、具体二十字辈谱系以及宗室女眷赐名礼制。"

 zibei_events.4.title: "钦定字辈规制"
 zibei_events.4.desc: "礼部遵旨拟具宗室赐名成法，或循五行偏旁，或重世代同旁，或取雅字通谱，各有法度。今恭请圣裁，择定一制以为我朝宗室百代之规。"
 zibei_events.4.a: "行五行相生之制"
 zibei_events.4.a.tt: "接下来将从两套二十字辈谱系中任选其一。当前统治者新出生的男性子辈将先取木字旁单字命名；自孙辈起正式按选定谱系排辈，男丁末字按「火、土、金、水、木」五行偏旁世代循环轮转（二十代后从头循环）。"
 zibei_events.4.b: "行世代同旁之制"
 zibei_events.4.b.tt: "此后新出生的宗室子嗣将按「胤弘永绵奕，载溥毓恒启，焘闿增祺敬，志开端锡英」顺序排辈，男丁名字末字各配以该代专属偏旁（二十代后从头循环）。"
 zibei_events.4.c: "行雅字通谱之制"
 zibei_events.4.c.tt: "接下来将从四套二十字辈谱系中任选其一。此后新出生的宗室子嗣将按选定谱系顺序排辈，名字末字不限特定偏旁，从通用雅字中择取（二十代后从头循环）。"

 zibei_events.1.title: "钦定五行字辈"
 zibei_events.1.desc: "木生于始，火继其明，五行相生，天道循环。诸皇子当先从木字旁单名以启运，自皇孙以降，依火、土、金、水、木五德偏旁序定末字。今请圣裁，择定二十字辈诗，以为我朝宗支万世相承之定制。"
 zibei_events.1.a: "「允文遵祖训，钦武大君胜，顺道宜逢吉，师良善用晟」"
 zibei_events.1.a.tt: "当前统治者新出生的儿子辈将先取木字旁单字命名；自孙辈起，新出生的宗室子嗣将从「允」字起按这二十字顺序排辈，男丁名字末字按火、土、金、水、木五行偏旁世代轮转（二十代后从头循环）。"
 zibei_events.1.b: "「高瞻祁见祐，厚载翊常由，慈和怡伯仲，简靖迪先猷」"
 zibei_events.1.b.tt: "当前统治者新出生的儿子辈将先取木字旁单字命名；自孙辈起，新出生的宗室子嗣将从「高」字起按这二十字顺序排辈，男丁名字末字按火、土、金、水、木五行偏旁世代轮转（二十代后从头循环）。"

 zibei_events.2.title: "钦定通谱字辈"
 zibei_events.2.desc: "礼臣采撷前贤雅训，谨拟数首二十字辈诗，词意雍容，不拘偏旁。今请圣裁择定其一，颁行宗室，永为定制。"
 zibei_events.2.a: "「立显荣朝士，文方运际祥，祖恩贻泽远，世代永承昌」"
 zibei_events.2.a.tt: "此后新出生的宗室子嗣将从「立」字起按这二十字顺序排辈，名字末字从通用雅字中择取（二十代后从头循环）。"
 zibei_events.2.b: "「希言公彦承，弘闻贞尚胤，兴毓传继广，昭宪庆繁祥」"
 zibei_events.2.b.tt: "此后新出生的宗室子嗣将从「希」字起按这二十字顺序排辈，名字末字从通用雅字中择取（二十代后从头循环）。"
 zibei_events.2.c: "「尊传代嗣本，肇立敬亲宗，景仰希先哲，贤良万世昌」"
 zibei_events.2.c.tt: "此后新出生的宗室子嗣将从「尊」字起按这二十字顺序排辈，名字末字从通用雅字中择取（二十代后从头循环）。"
 zibei_events.2.d: "「克复宗圣道，昭穆守家传，忠孝承先德，诗书启后贤」"
 zibei_events.2.d.tt: "此后新出生的宗室子嗣将从「克」字起按这二十字顺序排辈，名字末字从通用雅字中择取（二十代后从头循环）。"

 zibei_events.3.title: "明定字辈礼制"
 zibei_events.3.desc: "字辈谱系既已钦定，宗支序齿已有成规。唯宗室诸女是否亦依字辈赐名，尚待圣裁明定。"
 zibei_events.3.a: "恪守宗法旧制，仅宗室男丁按辈赐名"
 zibei_events.3.a.tt: "此后新出生的男性宗室子嗣将按选定的字辈谱系命名，女性子嗣不带字辈，直接从专属女性雅字库中取单字命名。"
 zibei_events.3.b: "皇子皇女同序，男女子嗣皆按辈赐名"
 zibei_events.3.b.tt: "此后新出生的宗室男女子嗣都将按选定的字辈谱系命名（女性子嗣末字仅从专属女性雅字库中选取，不考虑偏旁；尚未入辈的女儿亦从该字库取单字命名）。"

